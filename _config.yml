#-------------------------------
# General Site Settings
title: Kien Pham
logo: # You can add own logo. For example '/images/logo.png'.
description: 
baseurl: "" 
url: "https://joseph-jekyll.netlify.app"

#-------------------------------
# Language Settings
languages: ["en", "vi"]

#-------------------------------
# Build Settings
markdown: kramdown
permalink: pretty # A simple, safe default. The language plugin will handle the rest.

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll/tagging
  - jekyll-multiple-languages-plugin

paginate: 5
paginate_path: "/page/:num/" # Note: Pagination will be for the default language only.

# Defaults to ensure every page and post has a default language
defaults:
  -
    scope:
      path: "" # Apply to all files in the project
    values:
      lang: "en" # Set 'en' as the default language for EVERYTHING
  -
    scope:
      path: "_posts/vi" # Target only posts in the 'vi' folder
    values:
      lang: "vi" # Override the default and set their language to Vietnamese

# Exclude language folders from the root build
exclude_from_localizations: ["en", "vi"]

include:
  - _pages

# Tags
tag_page_dir: tag
tag_page_layout: tag_page
tag_permalink_style: /:title

sass:
  sass_dir: _sass
  style: compressed

# Author, Hero, Footer, and other settings go here...
# (Please ensure your other settings like author, hero, etc. are still in the file)


# -------------------------------
# Collections Settings for Atelier page
collections:
  atelier_items:
    output: false # We don't need Jekyll to create a separate page for each image
