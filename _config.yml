#-------------------------------
# Build Settings
markdown: kramdown
permalink: /:title # Reverted to the simple, original permalink style

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll/tagging
  # The jekyll-multiple-languages-plugin is no longer listed here

paginate: 5
paginate_path: "/page/:num"

# The complex 'defaults' block for languages has been removed
# This is the original 'defaults' block
defaults:
  - scope:
      path: '_pages'
    values:
      permalink: /:basename:output_ext

include:
  - _pages

# Tags
tag_page_dir: tag
tag_page_layout: tag_page
tag_permalink_style: /:title

sass:
  sass_dir: _sass
  style: compressed
