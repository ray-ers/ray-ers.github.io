#-------------------------------
# General Site Settings
title: Kien Pham
logo: # You can add own logo. For example '/images/logo.png'.
description: Personal website of Kien Pham, an environmental researcher working on urban ecosystems, nature-based solutions, ecosystem services, and resilient cities.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://kien-pham.com" # the base hostname & protocol for your site, e.g. http://example.com

#-------------------------------
# Author Settings
author:
  name: Kien Pham (Ray)
  bio: I hold a PhD in Earth and Environmental Sciences from Gustave Eiffel University. My work examines how nature-based solutions can support more resilient and sustainable cities. Alongside research, I am interested in teaching, science communication, and making complex environmental ideas more accessible.
  avatar: '/images/Author.jpeg'
  
social:
- {icon: "ion-ios-finger-print", label: ORCID, link: "https://orcid.org/0000-0001-7740-102X"}
- {icon: "ion-logo-linkedin", label: Linkedin, link: "https://www.linkedin.com/in/phamkien/"}
- {icon: "ion-logo-instagram", label: Instagram, link: "https://www.instagram.com/ray_theurbanist/"}
- {icon: "ion-ios-cafe", label: Ko-fi, link: "https://ko-fi.com/kienphamtrung"}

#-------------------------------
# Footer Settings
footer_text: "A space for research, teaching, writing, and observations about human, cities and nature."
tags_widget_title: "Explore Tags"

#-------------------------------
# Hero Settings
hero:
  hero__title: Hey, I’m Kien :) 
  hero__description: I research urban ecosystems and share my work, writing, teaching resources, and visual stories here.
  hero__image: '/images/01-1.jpg'


#-------------------------------
# Newsletter (_includes/footer-widgets/widget-subscribe.html)
mailchimp: true # To enable the mailchimp form, use the value 'true'.
mailchimp__title: New writing and projects
mailchimp__text: Receive occasional updates when I publish new research notes, essays, resources, or visual projects.
mailchimp__identifier: kien-pham.us9.list-manage.com/subscribe/post?u=448369886e33234793205a1e9&amp;id=9ac65d85d2 # Add your MailChimp form identifier.
mailchimp__button__text: Subscribe # Add your button text


#-------------------------------
# Contact Settings
contact:
  email: f/meqnbpaq # Add your email for contact form
  description: # Add a description of your form


#-------------------------------
# Google Analytics
google-analytics: G-SEF15G74N4 # Add your identifier. For example UA-99631805-1.


#-------------------------------
# Build Settings
markdown: kramdown
permalink: /:title 

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll/tagging

paginate: 6
paginate_path: "/page/:num"

# This is the original 'defaults' block
defaults:
  - scope:
      path: '_pages'
    values:
      permalink: /:basename:output_ext

include:
  - _pages

# Tags
tag_page_dir: tag
tag_page_layout: tag_page

sass:
  sass_dir: _sass
  style: compressed

#-------------------------------
# Collections Settings
collections:
  atelier_items:
    output: false
